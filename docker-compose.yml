# Local development in VS Code. Gives you Postgres+pgvector and Redis so you
# can build and test without touching Supabase or Upstash quotas.
#
#   docker compose up -d
#   uvicorn app.main:app --reload
#
# Migrations run automatically on first start: the files in migrations/ are
# mounted into Postgres's init directory and executed in filename order,
# which is why they're numbered.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentmemory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentmemory
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret
      ENVIRONMENT: development
      PORT: 8000
      ALLOW_ANONYMOUS_DEV_TENANT: "true"
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro

volumes:
  pgdata:
